# LY_Guide 讲解任务 —— 机器人端地图配置
#
# 改这里就能切换讲解任务使用的地图，不需要改任何代码。
#
# 地图目录约定：目录内必须同时存在 map.yaml / map.pgm / map.pcd
#   map.yaml + map.pgm   2D 占据栅格地图，由 nav2_map_server 加载，决定 map 坐标系
#   map.pcd              3D 点云地图，供 mid360 重定位使用（必须与 2D 图同一次建图产物）
#
# ⚠ 关键约束：讲解点 (x, y, angle) 与充电点 (chargeX, chargeY, chargeAngle)
#   全都是「当前加载的那张地图的 map 坐标系」下的值。
#   换地图 ⇒ 旧讲解点全部失效，必须在 LY_Guide 平台上、用同一张地图重新标定。

[map]
# 当前使用：巡检任务地图（英莱现场）
# 与 /home/smart/inspection_hmi_maps/yinglai/0903.pgm 是同一张图（MD5 一致）
dir = /home/smart/LY_inspect_ws/maps/0907

# 备选地图（把上面的 dir 注释掉，改用其中一行即可）
# dir = /home/smart/LY_inspect_ws/maps/0902
# dir = /home/smart/LY_Nav/LY_Nav/map          # 导览机器人原有地图（讲解任务原默认）

[mission]
# 讲解方案 ID；0 = 自动取后端第一个「启用」的方案
plan_id = 0
# true = 跳过导航、点位虚拟到达，只验证播报流程（联调）
dry_run = false
# LY_Guide 后端地址（与 Flask 同机）
backend_url = http://127.0.0.1:5000
